
name: Lab 06 Python CI

on:
  push:
    branches:
      - main-python
    paths:
      - "lab06-python/**"
      - ".github/workflows/lab06-python-ci.yml"

  pull_request:
    branches:
      - main-python
    paths:
      - "lab06-python/**"
      - ".github/workflows/lab06-python-ci.yml"

  workflow_dispatch:

jobs:
  python-ci:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: lab06-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting
        run: python -m ruff format --check .

      - name: Run pytest
        run: python -m pytest -v

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Verify installed CLI
        env:
          PYTHONIOENCODING: utf-8
        run: kzp-cinema --help

      - name: Upload distribution artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: lab06-python-distributions
          path: lab06-python/dist/*
