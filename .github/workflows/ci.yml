name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./mvnw clean verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify

      - name: Run SpotBugs (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./mvnw spotbugs:check

      - name: Run SpotBugs (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd spotbugs:check

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cinema-jar-${{ matrix.os }}
          path: target/*.jar