name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

      - name: Run SpotBugs
        run: ./mvnw spotbugs:check

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cinema-jar
          path: target/*.jar